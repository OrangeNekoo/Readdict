name: build

# 三平台自动构建：
#   - Windows x64  → windeployqt + 内置字体 → 便携 zip
#   - Linux x64    → linuxdeploy(+qt 插件) → AppImage
#   - macOS ARM    → deploy_script 目标（macdeployqt 全套）→ 自包含 .app zip
# 打 v* 标签时额外聚合产物发布 GitHub Release。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'ci/**'
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.11.1'

jobs:
  # ---------------------------------------------------------------- Windows
  # 注：aqtinstall（含最新 3.3.0）尚未支持 Qt 6.11 Windows 的新版元数据结构
  # （Updates.xml 移入 qt6_6111_msvc2022_64 分架构子目录），install-qt-action
  # 在 Windows 上会报 "Failed to locate XML data"。故此处绕过 aqt：直接解析
  # 官方 Updates.xml，下载 7z 分包解压部署，并按 Qt 版本做缓存。
  # 另：Qt 6.11 起 Qt PDF 不在主库元数据中，需从 extensions/qtpdf 扩展库安装。
  build-windows:
    name: Windows x64 (zip + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\Qt\6.11.1
          key: qt-${{ env.QT_VERSION }}-windows-msvc2022_64

      - name: Install Qt (manual 7z deployment, main + qtpdf extension)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { throw "未找到 7-Zip: $sevenZip" }
          # 分片 7z 内容无目录前缀，直接解压到 Qt 根（与下方 PATH 写入一致）
          $dest = "$env:RUNNER_TEMP\Qt\6.11.1\msvc2022_64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # 主库（base + 全部 addon，Qt 6.11 起 PDF/WebEngine 已移出主库）
          $repos = @(
            "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6111/qt6_6111_msvc2022_64",
            "https://download.qt.io/online/qtsdkrepository/windows_x86/extensions/qtpdf/6111/msvc2022_64"
          )
          foreach ($meta in $repos) {
            [xml]$xml = (Invoke-WebRequest "$meta/Updates.xml" -UseBasicParsing).Content
            $pkgs = $xml.Updates.PackageUpdate | Where-Object {
              $_.Name -and $_.DownloadableArchives -and
              $_.Name -notmatch 'debug_information|_examples|_doc|_src|qtwebengine'
            }
            if (!$pkgs) { throw "Updates.xml 未解析到任何包: $meta" }
            Write-Host "[$meta] 待安装包数: $($pkgs.Count)"
            foreach ($p in $pkgs) {
              foreach ($archive in ($p.DownloadableArchives -split ',\s*|\s+')) {
                if (!$archive -or $archive -match '^qtdoc-') { continue }  # 跳过文档分片
                $url = "$meta/$($p.Name)/$($p.Version)$archive"
                $tmp = Join-Path $env:RUNNER_TEMP $archive
                Invoke-WebRequest $url -OutFile $tmp -UseBasicParsing
                & $sevenZip x $tmp -o"$dest" -y -bso0 -bsp0
                if ($LASTEXITCODE -ne 0) { throw "解压失败: $archive" }
                Remove-Item $tmp
              }
            }
          }
          # 关键产物存在性校验（core 库、CMake 配置与 PDF 扩展）
          foreach ($f in @("$dest\bin\Qt6Core.dll", "$dest\lib\cmake\Qt6\Qt6Config.cmake", "$dest\lib\cmake\Qt6Pdf")) {
            if (!(Test-Path $f)) { throw "Qt 部署不完整，缺失: $f" }
          }

      - name: Add Qt to PATH
        shell: pwsh
        run: |
          $qtRoot = "$env:RUNNER_TEMP\Qt\6.11.1\msvc2022_64"
          "$qtRoot\bin" >> $env:GITHUB_PATH
          "CMAKE_PREFIX_PATH=$qtRoot" >> $env:GITHUB_ENV

      - name: Configure (MSVC x64)
        shell: pwsh
        run: |
          $qtRoot = "$env:RUNNER_TEMP\Qt\6.11.1\msvc2022_64"
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -A x64 "-DCMAKE_PREFIX_PATH=$qtRoot"

      - name: Build
        run: cmake --build build --config Release --target Readdict

      - name: Deploy runtime (windeployqt) and assemble portable layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ref 名可能含 /（如 ci/github-actions），不能进文件名
          $ver = "${{ github.ref_name }}" -replace '/','-'
          $exe = "build/Release/Readdict.exe"
          if (!(Test-Path $exe)) { throw "构建产物不存在: $exe" }
          windeployqt --release --qmldir src/ui/qml $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt 失败" }

          # 便携布局：exe 在 bin/，字体走 main.cpp 的 ../share/readdict/fonts 契约
          New-Item -ItemType Directory -Force -Path "pkg/bin", "pkg/share/readdict/fonts" | Out-Null
          Copy-Item "build/Release/*" "pkg/bin/" -Recurse -Force
          $fonts = @(
            "fronts/02_SourceHanSans-VF/02_SourceHanSans-VF/Variable/SourceHanSans-VF.otf.ttc",
            "fronts/02_SourceHanSans-VF/02_SourceHanSans-VF/Variable/SourceHanSansHW-VF.otf.ttc",
            "fronts/02_SourceHanSerif-VF/02_SourceHanSerif-VF/Variable/SourceHanSerif-VF.otf.ttc",
            "fronts/smiley-sans-v2.0.1/SmileySans-Oblique.otf"
          )
          foreach ($f in $fonts) {
            if (!(Test-Path $f)) { throw "字体缺失: $f" }
            Copy-Item $f "pkg/share/readdict/fonts/"
          }
          Compress-Archive -Path "pkg/*" -DestinationPath "Readdict-$ver-windows-x64.zip" -Force
          "ARTIFACT_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "未找到 Inno Setup: $iscc" }
          # runner 的 Inno Setup 不含简中语言文件，取自 issrc 官方 Unofficial 目录
          $isl = "packaging/windows/ChineseSimplified.isl"
          Invoke-WebRequest `
            "https://github.com/jrsoftware/issrc/raw/main/Files/Languages/Unofficial/ChineseSimplified.isl" `
            -OutFile $isl -UseBasicParsing
          & $iscc "/DMyAppVersion=$env:ARTIFACT_VERSION" packaging/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 打包失败" }
          Move-Item "packaging/windows/installer/Readdict-*-windows-x64-setup.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: Readdict-windows-x64
          path: |
            Readdict-*-windows-x64.zip
            Readdict-*-windows-x64-setup.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux
  build-linux:
    name: Linux x64 (AppImage)
    runs-on: ubuntu-24.04
    env:
      # AppImage 工具免 FUSE 自解压运行
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libvulkan-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 \
            libfontconfig1 libfreetype6 libdbus-1-3 libnss3

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtspeech
          cache: true

      - name: Install Qt PDF extension
        run: |
          set -euo pipefail
          python3 -m pip install --quiet py7zr
          python3 - <<'PY'
          import os, tempfile, urllib.request
          import xml.etree.ElementTree as ET
          import py7zr
          meta = "https://download.qt.io/online/qtsdkrepository/linux_x64/extensions/qtpdf/6111/x86_64"
          pkg = "extensions.qtpdf.6111.linux_gcc_64"
          root = os.environ["QT_ROOT_DIR"]
          xml = ET.fromstring(urllib.request.urlopen(f"{meta}/Updates.xml").read())
          n = 0
          for p in xml.findall(".//PackageUpdate"):
              archives = (p.findtext("DownloadableArchives") or "").replace(",", " ").split()
              if not archives:
                  continue
              ver = p.findtext("Version")
              for a in archives:
                  url = f"{meta}/{pkg}/{ver}{a}"
                  tmp = tempfile.NamedTemporaryFile(suffix=".7z", delete=False).name
                  urllib.request.urlretrieve(url, tmp)
                  with py7zr.SevenZipFile(tmp) as z:
                      z.extractall(root)
                  os.unlink(tmp)
                  n += 1
          print(f"qtpdf 扩展分片安装数: {n}")
          assert os.path.isdir(os.path.join(root, "lib", "cmake", "Qt6Pdf")), "Qt6Pdf 部署失败"
          PY

      - name: Configure & build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target Readdict -j"$(nproc)"

      - name: Assemble AppDir
        run: |
          set -euo pipefail
          test -x build/Readdict
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/readdict/fonts \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/Readdict AppDir/usr/bin/
          # 字体走 main.cpp 的 ../share/readdict/fonts 契约（exe 在 usr/bin 下）
          cp fronts/02_SourceHanSans-VF/02_SourceHanSans-VF/Variable/SourceHanSans-VF.otf.ttc \
             fronts/02_SourceHanSans-VF/02_SourceHanSans-VF/Variable/SourceHanSansHW-VF.otf.ttc \
             fronts/02_SourceHanSerif-VF/02_SourceHanSerif-VF/Variable/SourceHanSerif-VF.otf.ttc \
             fronts/smiley-sans-v2.0.1/SmileySans-Oblique.otf \
             AppDir/usr/share/readdict/fonts/
          cp packaging/linux/readdict.desktop AppDir/usr/share/applications/readdict.desktop
          cp packaging/icon/readdict.png AppDir/usr/share/icons/hicolor/256x256/apps/readdict.png

      - name: Build AppImage (linuxdeploy + qt plugin)
        run: |
          set -euo pipefail
          # linuxdeploy 与 qt 插件是两个独立 AppImage，插件须在 PATH 中可见
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export PATH="$PWD:$PATH"

          # Readdict.Backend / Readdict.UI 由 C++ 端注册，源码目录无对应 qmldir，
          # qmlimportscanner 会报 Missing module——用空模块声明喂饱扫描器
          mkdir -p /tmp/qml-dummy/Readdict/Backend /tmp/qml-dummy/Readdict/UI
          printf 'module Readdict.Backend\n' > /tmp/qml-dummy/Readdict/Backend/qmldir
          printf 'module Readdict.UI\n'       > /tmp/qml-dummy/Readdict/UI/qmldir

          # 排除依赖外部客户端库的 SQL 驱动（仅保留内置 SQLite）与
          # speech-dispatcher TTS 插件（运行时目标系统未装该库）
          export EXCLUDE_PLUGINS="qsqlmimer,qsqlpsql,qsqlmysql,qsqloci,qsqldb2,qsqlibase,qsqltds,qtexttospeech_speechd"
          EXTRA_QT_PLUGINS="qtbase;qtdeclarative;qtquickcontrols2;qtsvg;qtmultimedia;qtpdf;qttts;qttexttospeech" \
          QML_SOURCES_PATHS="/tmp/qml-dummy:$GITHUB_WORKSPACE/src/ui/qml" \
          OUTPUT="Readdict-$(echo '${{ github.ref_name }}' | tr / -)-linux-x86_64.AppImage" \
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e AppDir/usr/bin/Readdict \
            -d AppDir/usr/share/applications/readdict.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/readdict.png \
            --plugin qt \
            --output appimage
          ls -lh Readdict-*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: Readdict-linux-x86_64
          path: Readdict-*-linux-x86_64.AppImage
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  build-macos:
    name: macOS ARM (app zip)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia qtspeech
          cache: true

      - name: Install Qt PDF extension
        run: |
          set -euo pipefail
          python3 -m pip install --quiet py7zr
          python3 - <<'PY'
          import os, tempfile, urllib.request
          import xml.etree.ElementTree as ET
          import py7zr
          meta = "https://download.qt.io/online/qtsdkrepository/mac_x64/extensions/qtpdf/6111/clang_64"
          pkg = "extensions.qtpdf.6111.clang_64"
          root = os.environ["QT_ROOT_DIR"]
          xml = ET.fromstring(urllib.request.urlopen(f"{meta}/Updates.xml").read())
          n = 0
          for p in xml.findall(".//PackageUpdate"):
              archives = (p.findtext("DownloadableArchives") or "").replace(",", " ").split()
              if not archives:
                  continue
              ver = p.findtext("Version")
              for a in archives:
                  url = f"{meta}/{pkg}/{ver}{a}"
                  tmp = tempfile.NamedTemporaryFile(suffix=".7z", delete=False).name
                  urllib.request.urlretrieve(url, tmp)
                  with py7zr.SevenZipFile(tmp) as z:
                      z.extractall(root)
                  os.unlink(tmp)
                  n += 1
          print(f"qtpdf 扩展分片安装数: {n}")
          assert os.path.isdir(os.path.join(root, "lib", "cmake", "Qt6Pdf")), "Qt6Pdf 部署失败"
          PY

      - name: Build self-contained .app (deploy_script)
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target deploy_script

      - name: Zip bundle
        run: |
          test -d build/Readdict.app
          # ditto 保留 Mach-O 签名与扩展属性，保证 ad-hoc 签名不被破坏
          ditto -c -k --sequesterRsrc --keepParent build/Readdict.app \
            "Readdict-$(echo '${{ github.ref_name }}' | tr / -)-macos-arm64.zip"
          ls -lh Readdict-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Readdict-macos-arm64
          path: Readdict-*-macos-arm64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
