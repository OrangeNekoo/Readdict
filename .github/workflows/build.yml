name: build

# 三平台自动构建：
#   - Windows x64  → windeployqt + 内置字体 → 便携 zip
#   - Linux x64    → linuxdeploy(+qt 插件) → AppImage
#   - macOS ARM    → deploy_script 目标（macdeployqt 全套）→ 自包含 .app zip
# 打 v* 标签时额外聚合产物发布 GitHub Release。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'ci/**'
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.11.1'

jobs:
  # ---------------------------------------------------------------- Windows
  build-windows:
    name: Windows x64 (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtpdf
          cache: true

      - name: Configure (MSVC x64)
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -A x64

      - name: Build
        run: cmake --build build --config Release --target Readdict

      - name: Deploy runtime (windeployqt) and assemble portable layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "build/Release/Readdict.exe"
          if (!(Test-Path $exe)) { throw "构建产物不存在: $exe" }
          windeployqt --release --qmldir src/ui/qml $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt 失败" }

          # 便携布局：exe 在 bin/，字体走 main.cpp 的 ../share/readdict/fonts 契约
          New-Item -ItemType Directory -Force -Path "pkg/bin", "pkg/share/readdict/fonts" | Out-Null
          Copy-Item "build/Release/*" "pkg/bin/" -Recurse -Force
          $fonts = @(
            "fronts/02_SourceHanSans-VF/02_SourceHanSans-VF/Variable/SourceHanSans-VF.otf.ttc",
            "fronts/02_SourceHanSans-VF/02_SourceHanSans-VF/Variable/SourceHanSansHW-VF.otf.ttc",
            "fronts/02_SourceHanSerif-VF/02_SourceHanSerif-VF/Variable/SourceHanSerif-VF.otf.ttc",
            "fronts/smiley-sans-v2.0.1/SmileySans-Oblique.otf"
          )
          foreach ($f in $fonts) {
            if (!(Test-Path $f)) { throw "字体缺失: $f" }
            Copy-Item $f "pkg/share/readdict/fonts/"
          }
          Compress-Archive -Path "pkg/*" -DestinationPath "Readdict-${{ github.ref_name }}-windows-x64.zip" -Force
          Remove-Item -Recurse -Force pkg

      - uses: actions/upload-artifact@v4
        with:
          name: Readdict-windows-x64
          path: Readdict-*-windows-x64.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux
  build-linux:
    name: Linux x64 (AppImage)
    runs-on: ubuntu-24.04
    env:
      # AppImage 工具免 FUSE 自解压运行
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libvulkan-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 \
            libfontconfig1 libfreetype6 libdbus-1-3 libnss3

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtpdf
          cache: true

      - name: Configure & build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target Readdict -j"$(nproc)"

      - name: Assemble AppDir
        run: |
          set -euo pipefail
          test -x build/Readdict
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/readdict/fonts \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/Readdict AppDir/usr/bin/
          # 字体走 main.cpp 的 ../share/readdict/fonts 契约（exe 在 usr/bin 下）
          cp fronts/02_SourceHanSans-VF/02_SourceHanSans-VF/Variable/SourceHanSans-VF.otf.ttc \
             fronts/02_SourceHanSans-VF/02_SourceHanSans-VF/Variable/SourceHanSansHW-VF.otf.ttc \
             fronts/02_SourceHanSerif-VF/02_SourceHanSerif-VF/Variable/SourceHanSerif-VF.otf.ttc \
             fronts/smiley-sans-v2.0.1/SmileySans-Oblique.otf \
             AppDir/usr/share/readdict/fonts/
          cp packaging/linux/readdict.desktop AppDir/usr/share/applications/readdict.desktop
          cp packaging/icon/readdict.png AppDir/usr/share/icons/hicolor/256x256/apps/readdict.png

      - name: Build AppImage (linuxdeploy + qt plugin)
        run: |
          set -euo pipefail
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          EXTRA_QT_PLUGINS="qtbase;qtdeclarative;qtquickcontrols2;qtsvg;qtmultimedia;qtpdf;qttts;qttexttospeech" \
          QML_SOURCES_PATHS="$GITHUB_WORKSPACE/src/ui/qml" \
          OUTPUT="Readdict-${{ github.ref_name }}-linux-x86_64.AppImage" \
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e AppDir/usr/bin/Readdict \
            -d AppDir/usr/share/applications/readdict.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/readdict.png \
            --plugin qt \
            --output appimage
          ls -lh Readdict-*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: Readdict-linux-x86_64
          path: Readdict-*-linux-x86_64.AppImage
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  build-macos:
    name: macOS ARM (app zip)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtpdf
          cache: true

      - name: Build self-contained .app (deploy_script)
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target deploy_script

      - name: Zip bundle
        run: |
          test -d build/Readdict.app
          # ditto 保留 Mach-O 签名与扩展属性，保证 ad-hoc 签名不被破坏
          ditto -c -k --sequesterRsrc --keepParent build/Readdict.app \
            "Readdict-${{ github.ref_name }}-macos-arm64.zip"
          ls -lh Readdict-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Readdict-macos-arm64
          path: Readdict-*-macos-arm64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
